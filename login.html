<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Sedulur ALUMNI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="login-page">
    <!-- Login Background Shapes -->
    <div class="hero-shapes" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;">
        <div class="shape shape-1" style="width: 500px; height: 500px;"></div>
        <div class="shape shape-2" style="width: 400px; height: 400px; bottom: 0; top: auto;"></div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1>SEDULUR ALUMNI</h1>
                <p>Admin Dashboard Login</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input type="text" id="username" name="username" required placeholder="Masukkan username" autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="password" name="password" required placeholder="Masukkan password" autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group remember-me">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember">
                        <span class="checkmark"></span>
                        Ingat saya
                    </label>
                </div>
                <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 20px; text-align: center;">
                    <i class="fas fa-info-circle" style="color: var(--accent-teal);"></i>
                    Apabila sandi salah, hubungi developer untuk mendapatkan akses
                </p>
                <button type="submit" class="btn btn-primary btn-block btn-login-submit">
                    <span class="btn-text">Masuk</span>
                    <span class="btn-icon"><i class="fas fa-sign-in-alt"></i></span>
                </button>
            </form>

            <div class="login-footer">
                <a href="index.html" class="back-home">
                    <i class="fas fa-arrow-left"></i>
                    Kembali ke Beranda
                </a>
            </div>

            <div class="login-info">
                <p><i class="fas fa-shield-alt"></i> Akses khusus administrator</p>
            </div>
        </div>
    </div>

    <!-- Error Toast -->
    <div class="toast toast-error" id="loginError">
        <div class="toast-icon">
            <i class="fas fa-exclamation-circle"></i>
        </div>
        <div class="toast-message">
            <strong>Login Gagal!</strong>
            <span id="errorMessage">Username atau password salah</span>
        </div>
        <button class="toast-close" onclick="closeToast()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Close toast function
        function closeToast() {
            document.getElementById('loginError').classList.remove('show');
        }
    </script>
</body>
</html>
